version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: xsolla_explorer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: xsolla_explorer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_init_schema.up.sql:/docker-entrypoint-initdb.d/001_init_schema.up.sql
      - ./backend/migrations/002_seed_crescent_office.up.sql:/docker-entrypoint-initdb.d/002_seed_crescent_office.up.sql

volumes:
  pgdata:
